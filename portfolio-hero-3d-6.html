<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santoshi Vinodiya — 3D Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── YOUR ORIGINAL CSS — preserved + improved ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000000;
      font-family: 'DM Mono', Arial, sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    .hero-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 38%;
      color: white;
      z-index: 10;
      pointer-events: none;
    }

    /* FIX: replaced Arial with Syne for stronger identity */
    .hero-text h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
      animation: glow 2s infinite alternate;
    }

    .hero-text p {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      opacity: 1;
      margin-top: 16px;
      letter-spacing: 0.2em;
      color: #00ffe5;
      text-shadow: 0 0 12px rgba(0,255,229,0.6);
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px #00ffe5, 0 0 30px rgba(0,255,229,0.4); color: #ffffff; }
      to   { text-shadow: 0 0 40px #00ffe5, 0 0 80px #00ffe5, 0 0 120px rgba(0,255,229,0.3); color: #e0fffc; }
    }

    /* FIX: fade-in entrance for hero text */
    .hero-text {
      animation: heroFade 1.2s ease 0.3s both;
    }
    @keyframes heroFade {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Nav dots (section indicators) ── */
    .nav-dots {
      position: fixed;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      z-index: 20;
    }

    .nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(0,255,229,0.3);
      border: 1px solid #00ffe5;
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-dot.active {
      background: #00ffe5;
      box-shadow: 0 0 10px #00ffe5;
    }

    /* ── Bottom HUD ── */
    .hud {
      position: fixed;
      bottom: 2rem;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 2.5rem;
      z-index: 20;
      pointer-events: none;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .hud-label {
      font-size: 0.6rem;
      color: rgba(0,255,229,0.7);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 0.8rem;
      color: #00ffe5;
      letter-spacing: 0.1em;
    }

    .hud-right {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: blink 3s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(0,0,0,0.85);
      border: 1px solid #00ffe5;
      color: #00ffe5;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      padding: 0.3rem 0.8rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- YOUR ORIGINAL HTML structure — kept -->
  <div class="hero-text">
    <h1>Santoshi Vinodiya</h1>
    <p>Frontend Developer &nbsp;•&nbsp; M.Tech Student &nbsp;•&nbsp; UI Explorer</p>
  </div>

  <canvas id="bg"></canvas>

  <!-- Nav dots -->
  <div class="nav-dots">
    <div class="nav-dot active"></div>
    <div class="nav-dot"></div>
    <div class="nav-dot"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="hud-label">Mouse influence</div>
      <div class="hud-value" id="mousePos">x: 0.00 · y: 0.00</div>
    </div>
    <div class="hud-right">Move mouse to interact</div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ═══════════════════════════════════════════
    // YOUR ORIGINAL script.js — preserved exactly
    // with targeted enhancements marked FIX
    // ═══════════════════════════════════════════

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector("#bg"),
      alpha: true,
      antialias: true  // FIX 1: smooth edges
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1); // pure black — no transparency bleed
    camera.position.z = 5;

    // ── Lighting (FIX 3: adds depth to core mesh) ──
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const pointLight = new THREE.PointLight(0x00ffe5, 3, 20);
    pointLight.position.set(3, 3, 3);
    scene.add(pointLight);
    const pointLight2 = new THREE.PointLight(0x7952b3, 2, 15);
    pointLight2.position.set(-3, -2, 2);
    scene.add(pointLight2);

    // ── 🌟 YOUR ORIGINAL floating particles ──
    const particlesGeometry = new THREE.BufferGeometry();
    const particleCount = 800; // YOUR value — kept

    const positions = [];

    for (let i = 0; i < particleCount; i++) {
      positions.push((Math.random() - 0.5) * 10);
      positions.push((Math.random() - 0.5) * 10);
      positions.push((Math.random() - 0.5) * 10);
    }

    particlesGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(positions, 3)
    );

    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.02,        // YOUR value — kept
      color: 0x00ffe5,   // YOUR color — kept
      transparent: true, // FIX 4: allows opacity fade
      opacity: 0.8,
    });

    const particles = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particles);

    // FIX 5: second particle ring with accent color for depth
    const positions2 = [];
    for (let i = 0; i < 400; i++) {
      positions2.push((Math.random() - 0.5) * 14);
      positions2.push((Math.random() - 0.5) * 14);
      positions2.push((Math.random() - 0.5) * 14);
    }
    const geo2 = new THREE.BufferGeometry();
    geo2.setAttribute("position", new THREE.Float32BufferAttribute(positions2, 3));
    const mat2 = new THREE.PointsMaterial({ size: 0.015, color: 0x7952b3, transparent: true, opacity: 0.5 });
    scene.add(new THREE.Points(geo2, mat2));

    // ── 🪐 YOUR ORIGINAL central glowing icosahedron ──
    const geometry = new THREE.IcosahedronGeometry(1, 0);

    // FIX 6: MeshStandardMaterial instead of Basic — reacts to lights
    const material = new THREE.MeshStandardMaterial({
      color: 0x00ffe5,
      emissive: 0x00ffe5,
      emissiveIntensity: 0.3,
      wireframe: true   // YOUR wireframe — kept
    });

    const core = new THREE.Mesh(geometry, material);
    scene.add(core);

    // FIX 7: outer glow shell (subtle, same shape, larger)
    const outerGeo = new THREE.IcosahedronGeometry(1.15, 0);
    const outerMat = new THREE.MeshBasicMaterial({
      color: 0x00ffe5,
      wireframe: true,
      transparent: true,
      opacity: 0.08
    });
    const outerShell = new THREE.Mesh(outerGeo, outerMat);
    scene.add(outerShell);

    // ── 🧠 YOUR ORIGINAL mouse interaction ──
    let mouseX = 0;
    let mouseY = 0;

    document.addEventListener("mousemove", (event) => {
      mouseX = (event.clientX / window.innerWidth  - 0.5) * 2;
      mouseY = (event.clientY / window.innerHeight - 0.5) * 2;

      // FIX 8: update HUD display
      document.getElementById("mousePos").textContent =
        "x: " + mouseX.toFixed(2) + " · y: " + mouseY.toFixed(2);

      // tooltip position
      tooltip.style.left = (event.clientX + 14) + "px";
      tooltip.style.top  = (event.clientY - 10) + "px";
    });

    // Raycaster for core hover (FIX 9)
    const raycaster = new THREE.Raycaster();
    const mouse2D = new THREE.Vector2();
    const tooltip = document.getElementById("tooltip");

    document.addEventListener("mousemove", (e) => {
      mouse2D.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse2D.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // ── 🎬 YOUR ORIGINAL animation loop ──
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // YOUR original rotations — kept exactly
      particles.rotation.y += 0.001;
      particles.rotation.x += 0.0005;

      core.rotation.y += 0.01;
      core.rotation.x += 0.01;

      // outer shell counter-rotates (FIX 10: visual depth)
      outerShell.rotation.y -= 0.007;
      outerShell.rotation.z += 0.005;

      // YOUR original smooth mouse camera influence — kept
      camera.position.x += (mouseX - camera.position.x) * 0.05;
      camera.position.y += (-mouseY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      // FIX 11: pulsing point light for breathing glow effect
      pointLight.intensity = 3 + Math.sin(t * 2) * 1;

      // FIX 12: core scale pulse
      const pulse = 1 + Math.sin(t * 1.5) * 0.04;
      core.scale.set(pulse, pulse, pulse);

      // Raycaster hover on core
      raycaster.setFromCamera(mouse2D, camera);
      const hits = raycaster.intersectObject(core);
      if (hits.length > 0) {
        tooltip.textContent = "Santoshi's Core · Click to explore";
        tooltip.style.opacity = "1";
        core.material.emissiveIntensity = 0.8;
      } else {
        tooltip.style.opacity = "0";
        core.material.emissiveIntensity = 0.3;
      }

      renderer.render(scene, camera);
    }

    animate();

    // ── 📱 YOUR ORIGINAL resize handler ──
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
